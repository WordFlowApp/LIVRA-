// LIVRA Android wrapper — first APK build validation.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.livra.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.livra.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
