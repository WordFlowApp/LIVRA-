// LIVRA Android wrapper — release candidate 4.6.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.livra.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.livra.app'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '4.6'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
