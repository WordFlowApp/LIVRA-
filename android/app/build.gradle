// LIBRA VOZ Android release candidate 5.0.0.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.livra.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.livra.app'
        // Native shared AudioRecord/SpeechRecognizer capture uses segmented audio-source APIs (Android 13+).
        // Keep minSdk aligned with the runtime guard in MainActivity until a tested legacy capture path exists.
        minSdk 33
        targetSdk 35
        versionCode 20
        versionName '5.0.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
