// LIVRA Android wrapper — release candidate 4.1.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.livra.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.livra.app'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '4.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
