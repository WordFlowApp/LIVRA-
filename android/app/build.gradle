// LIVRA Android wrapper — first APK build validation.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.livra.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.livra.app'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '3.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
