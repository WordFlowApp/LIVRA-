name: Build LIVRA Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate JavaScript and text-only book flow
        run: |
          node --check app.js
          node --check voice-commands.js
          node --test voice-commands.test.cjs
          node --check worker/src/index.js
          node --check sw.js
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const app = readFileSync('app.js', 'utf8');
          const html = readFileSync('index.html', 'utf8');
          const voiceCommands = readFileSync('voice-commands.js', 'utf8');
          const worker = readFileSync('worker/src/index.js', 'utf8');
          const sw = readFileSync('sw.js', 'utf8');
          const coverCss = readFileSync('typographic-covers.css', 'utf8');
          const gridCss = readFileSync('library-grid.css', 'utf8');
          const gradle = readFileSync('android/app/build.gradle', 'utf8');
          assert.match(app, /localDraftFromTranscript/);
          assert.match(app, /buildingBook/);
          assert.match(app, /coverStyle:"typographic"/);
          assert.match(app, /await getAll\("books"\)/);
          assert.doesNotMatch(app, /recoverMissingBookCovers|generateAICover|\/cover/);
          assert.doesNotMatch(html, /book-visuals\.js|book-visuals\.css/);
          assert.match(html, /LIBRA VOZ 5\.1\.1/);
          assert.match(worker, /status: 410/);
          assert.match(worker, /superó el límite de 40 segundos/);
          assert.match(coverCss, /book-cover-typographic/);
          assert.match(gridCss, /grid-template-columns:\s*repeat\(3/);
          assert.match(gradle, /versionName '5.1.1'/);
          assert.match(gradle, /versionCode 22/);
          const activity = readFileSync('android/app/src/main/java/com/livra/app/MainActivity.java', 'utf8');
          assert.match(activity, /WebViewAssetLoader/);
          assert.match(activity, /wordflowapp/);
          assert.match(gradle, /copyLivraWebAssets/);
          assert.match(html, /id="voiceCommandButton"/);
          assert.match(html, /voice-commands\.js/);
          assert.match(app, /startCommandListening/);
          assert.match(app, /LIVRACommandParser\.parse/);
          assert.match(voiceCommands, /openEditorial/);
          assert.match(activity, /startCommandListening/);
          assert.match(activity, /commandResult/);
          assert.match(sw, /voice-commands\\.js\\?v=1/);
          assert.match(sw, /app\\.js\\?v=71/);
          assert.match(sw, /libra-voz-shell-v79/);
          console.log('LIBRA VOZ 5.1.1 voice command bridge checks passed.');
          NODE
      - name: Build debug APK
        run: gradle -p android assembleDebug
      - name: Verify Android APK package
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -Z1 "$APK" | grep -qx 'AndroidManifest.xml'
          unzip -Z1 "$APK" | grep -q 'classes.dex'
          unzip -Z1 "$APK" | grep -qx 'assets/www/index.html'
          unzip -Z1 "$APK" | grep -qx 'assets/www/app.js'
          unzip -Z1 "$APK" | grep -qx 'assets/www/styles.css'
          unzip -Z1 "$APK" | grep -qx 'assets/www/voice-commands.js'
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIBRA-VOZ-5.1.1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
