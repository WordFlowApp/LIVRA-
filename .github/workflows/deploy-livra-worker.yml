name: Deploy LIVRA AI Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/src/**"
      - "worker/wrangler.jsonc"
      - ".github/workflows/deploy-livra-worker.yml"
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --global wrangler
      - name: Detect Cloudflare account
        run: |
          ACCOUNT_ID=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts" | jq -er '.result[0].id')
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
