name: LIVRA Android 4.6

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "app.js"
      - "index.html"
      - "book-visuals.js"
      - "book-visuals.css"
      - "sw.js"
      - ".github/workflows/livra-android-4.6.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LIVRA
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check book-visuals.js

      - name: Build Android debug APK
        run: gradle --no-daemon --project-dir android assembleDebug

      - name: Upload LIVRA 4.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: LIVRA-4.6-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
